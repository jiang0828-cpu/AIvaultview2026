[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["price_compare/tests"]

[tool.ruff]
line-length = 180
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]
ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["arg-type", "assignment"]
