# Bootstrap site for certificate validation only. Login stays unavailable over HTTP.
# Install only after checking existing virtual hosts for this exact server_name.
server {
    listen 80;
    listen [::]:80;
    server_name vault.trialmatch.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vaultview/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Site preparation in progress.\n";
    }
}
