# Replace the bootstrap virtual host after obtaining a certificate for this hostname.
# This file belongs inside the existing nginx http context.
limit_req_zone $binary_remote_addr zone=vaultview_login:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vault.trialmatch.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vaultview/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://vault.trialmatch.xin$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vault.trialmatch.xin;

    ssl_certificate /etc/letsencrypt/live/vault.trialmatch.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.trialmatch.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/vaultview/current/frontend/dist;
    index index.html;
    client_max_body_size 150k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/vaultview-access.log;
    error_log /var/log/nginx/vaultview-error.log warn;

    location = /api/auth/login {
        limit_req zone=vaultview_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3101;
        include /etc/nginx/snippets/vaultview-proxy.conf;
    }

    location ^~ /api/research/ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:3101;
        include /etc/nginx/snippets/vaultview-proxy.conf;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3101;
        include /etc/nginx/snippets/vaultview-proxy.conf;
    }

    # All media requests must pass application authentication and project authorization.
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:3101;
        include /etc/nginx/snippets/vaultview-proxy.conf;
        proxy_buffering off;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
